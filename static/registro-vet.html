
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Assistente Pet | Registro de Veterinário</title>
    <link rel="stylesheet" href="css/registro.css" />
</head>
<body>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 500px;
      padding: 2.6rem;
      border-radius: 12px;
      box-shadow: 0px 4px 14px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo-area h1 {
      font-size: 2rem;
      margin-bottom: 0.3rem;
      color: #1e4a7d;
      font-weight: bold;
    }

    .logo-area h1 span {
      color: #2fa54d;
    }

    .logo-area p {
      font-size: 1rem;
      color: #444;
      margin-bottom: 1.8rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e4a7d;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #c9d4e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: 0.25s;
    }

    .input-group input:focus {
      border-color: #2fa54d;
      outline: none;
      box-shadow: 0px 0px 4px rgba(47, 165, 77, 0.4);
    }

    .btn {
      width: 100%;
      background: #2fa54d;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.25s;
    }

    .btn:hover {
      background: #279244;
    }

    .footer-text {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #333;
    }

    .footer-text a {
      color: #1e4a7d;
      font-weight: 600;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .card {
        padding: 2rem;
        max-width: 95%;
      }

      .logo-area h1 {
        font-size: 1.7rem;
      }
    }
</style>

<div class="card">
    <div class="logo-area">
        <h1>Criar Conta de <span>Veterinário</span></h1>
        <p>Informe seus dados profissionais</p>
    </div>

    <form id="registro-form" novalidate>
        <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome completo"
                    required
            />
        </div>

        <div class="input-group">
            <label for="crmv"
            >CRMV (Conselho Regional de Medicina Veterinária) *</label
            >
            <input type="text" id="crmv" placeholder="Ex: 12345" required />
        </div>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input
                    type="email"
                    id="email"
                    placeholder="seuemail@exemplo.com"
                    required
            />
        </div>

        <div class="input-group">
            <label for="cpf">CPF</label>
            <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    required
                    maxlength="14"
            />
        </div>

        <div class="input-group">
            <label for="telefone">Celular</label>
            <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                    maxlength="15"
            />
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    required
            />
        </div>

        <div class="input-group">
            <label for="confirmar-senha">Confirmar Senha</label>
            <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme sua senha"
                    required
            />
        </div>

        <button type="submit" class="btn">Registrar</button>
    </form>

    <div class="footer-text">
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>
</div>

<script>
    // --- Funções de Máscara (copiadas do registro.html) ---
    const cpfInput = document.getElementById("cpf");
    cpfInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/\D/g, "");
      value = value.replace(/(\d{3})(\d)/, "$1.$2");
      value = value.replace(/(\d{3})(\d)/, "$1.$2");
      value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      e.target.value = value;
    });

    const telInput = document.getElementById("telefone");
    telInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/\D/g, "");
      value = value.replace(/^(\d{2})(\d)/, "($1) $2");
      value = value.replace(/(\d{5})(\d)/, "$1-$2");
      e.target.value = value;
    });

    // --- Função Principal de Registro (MODIFICADA) ---
    document.addEventListener("DOMContentLoaded", () => {
      const registroForm = document.getElementById("registro-form");

      registroForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        // Pega os valores dos campos
        const nome = document.getElementById("nome").value;
        const crmv = document.getElementById("crmv").value; // <-- CAMPO NOVO
        const email = document.getElementById("email").value;
        const cpf = document.getElementById("cpf").value;
        const telefone = document.getElementById("telefone").value;
        const senha = document.getElementById("senha").value;
        const confirmarSenha =
          document.getElementById("confirmar-senha").value;

        // Validação
        if (senha !== confirmarSenha) {
          alert("As senhas não são iguais!");
          return;
        }
        if (cpf.length !== 14) {
          alert("CPF inválido.");
          return;
        }
        if (!crmv) {
          // <-- VALIDAÇÃO NOVA
          alert("O campo CRMV é obrigatório.");
          return;
        }

        // --- MUDANÇA PRINCIPAL ---
        // Define a URL da API de Veterinários
        const apiUrl = "/api/veterinarios"; // <-- MUDANÇA AQUI

        // Cria o objeto JSON que o VeterinarioController espera
        const novoVeterinario = {
          nome: nome,
          cpf: cpf.replace(/\D/g, ""),
          email: email,
          senha: senha,
          telefones: [telefone],
          crmv: crmv, // <-- CAMPO NOVO
        };
        // --- FIM DA MUDANÇA ---

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(novoVeterinario),
          });

          if (response.status === 201) {
            alert("Veterinário registrado com sucesso! Faça o login.");
            window.location.href = "login.html"; // Redireciona para o login
          } else {
            alert(
              "Erro ao registrar. Verifique os dados (Email ou CPF podem já existir)."
            );
          }
        } catch (error) {
          console.error("Erro de rede:", error);
          alert("Erro de Rede: Não foi possível conectar ao servidor.");
        }
      });
    });
</script>
</body>
</html>
