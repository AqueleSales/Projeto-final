
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Gerenciar Clínicas</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <style>
        body {
          padding: 2rem;
          background-color: #f0f2f5;
        }
        .container {
          background: #fff;
          padding: 2.5rem;
          max-width: 900px;
          margin: 2rem auto;
          border-radius: 18px;
          box-shadow: 0px 0px 15px #0000001a;
        }
        .container h1 {
          color: #3498db;
        }
        .form-admin {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1rem;
          margin-top: 1.5rem;
        }
        .form-admin .input-group {
          margin: 0;
        }
        .form-admin label {
          font-weight: 600;
          color: #333;
          display: block;
          margin-bottom: 5px;
        }
        .form-admin input {
          width: 100%;
          padding: 12px;
          border-radius: 8px;
          border: 2px solid #ccc;
          outline: none;
          box-sizing: border-box;
        }
        .form-admin .full-width {
          grid-column: span 2;
        }
        .btn-salvar {
          background: #28a745;
          color: white;
          padding: 12px;
          border: none;
          border-radius: 8px;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
        }
        .btn-cancelar {
          background: #6c757d;
          color: white;
          padding: 12px;
          border: none;
          border-radius: 8px;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          display: none; /* Começa escondido */
        }
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 2rem;
        }
        th,
        td {
          border: 1px solid #ddd;
          padding: 12px;
          text-align: left;
        }
        th {
          background-color: #f2f2f2;
        }
        .btn-acao {
          padding: 5px 10px;
          border: none;
          border-radius: 6px;
          color: white;
          font-weight: bold;
          cursor: pointer;
          margin-right: 5px;
        }
        .btn-editar {
          background: #007bff;
        }
        .btn-excluir {
          background: #dc3545;
        }
        .admin-nav {
          display: flex;
          gap: 20px;
          margin-bottom: 1rem;
          border-bottom: 1px solid #eee;
          padding-bottom: 1rem;
        }
        .admin-nav a {
          font-weight: bold;
          color: #3498db;
          text-decoration: none;
          font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="admin-nav">
        <a href="dashboard-vet.html">&larr; Voltar ao Dashboard</a>
        <a href="admin-vacinas.html">Gerenciar Vacinas</a>
    </div>
    <h1 id="form-titulo">Gerenciar Clínicas</h1>
    <p>Adicione, edite ou remova as clínicas disponíveis no sistema.</p>
    <form id="form-clinica" class="form-admin">
        <input type="hidden" id="clinica-id" />
        <div class="input-group">
            <label for="clinica-nome">Nome da Clínica *</label>
            <input
                    type="text"
                    id="clinica-nome"
                    placeholder="Ex: Clínica VetSaúde"
                    required
            />
        </div>
        <div class="input-group">
            <label for="clinica-email">Email</label>
            <input
                    type="email"
                    id="clinica-email"
                    placeholder="Ex: contato@vetsaude.com"
            />
        </div>
        <div class="input-group">
            <label for="clinica-rua">Rua</label>
            <input type="text" id="clinica-rua" placeholder="Ex: Av. Principal" />
        </div>
        <div class="input-group">
            <label for="clinica-numero">Número</label>
            <input type="text" id="clinica-numero" placeholder="Ex: 123" />
        </div>
        <div class="input-group">
            <label for="clinica-bairro">Bairro</label>
            <input type="text" id="clinica-bairro" placeholder="Ex: Centro" />
        </div>
        <div class="input-group">
            <label for="clinica-cidade">Cidade</label>
            <input type="text" id="clinica-cidade" placeholder="Ex: Brasília" />
        </div>
        <div class="input-group full-width">
            <label for="clinica-cep">CEP</label>
            <input type="text" id="clinica-cep" placeholder="Ex: 70000-000" />
        </div>
        <button type="submit" class="btn-salvar full-width">
            Salvar Clínica
        </button>
        <button
                type="button"
                class="btn-cancelar full-width"
                id="btn-cancelar-edicao"
        >
            Cancelar Edição
        </button>
    </form>
</div>
<div class="container">
    <h2>Clínicas Cadastradas</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Cidade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="tabela-clinicas-corpo">
        </tbody>
    </table>
</div>

<script>
    let clinicasCarregadas = [];
    const formClinica = document.getElementById("form-clinica");
    const formTitulo = document.getElementById("form-titulo");
    const clinicaIdInput = document.getElementById("clinica-id");
    const clinicaNomeInput = document.getElementById("clinica-nome");
    const clinicaEmailInput = document.getElementById("clinica-email");
    const clinicaRuaInput = document.getElementById("clinica-rua");
    const clinicaNumeroInput = document.getElementById("clinica-numero");
    const clinicaBairroInput = document.getElementById("clinica-bairro");
    const clinicaCidadeInput = document.getElementById("clinica-cidade");
    const clinicaCepInput = document.getElementById("clinica-cep");
    const btnCancelarEdicao = document.getElementById("btn-cancelar-edicao");
    const tabelaCorpo = document.getElementById("tabela-clinicas-corpo");
    async function carregarClinicas() {
      tabelaCorpo.innerHTML = '<tr><td colspan="5">Carregando...</td></tr>';
      try {
        const response = await fetch("/api/clinicas");
        if (!response.ok) throw new Error("Erro ao buscar clínicas.");
        clinicasCarregadas = await response.json(); // Salva no cache
        tabelaCorpo.innerHTML = ""; // Limpa a tabela
        if (clinicasCarregadas.length === 0) {
          tabelaCorpo.innerHTML =
            '<tr><td colspan="5">Nenhuma clínica cadastrada.</td></tr>';
          return;
        }
        clinicasCarregadas.forEach((clinica) => {
          tabelaCorpo.innerHTML += `
                  <tr>
                      <td>${clinica.idClinica}</td>
                      <td>${clinica.nome}</td>
                      <td>${clinica.email || "N/A"}</td>
                      <td>${clinica.cidade || "N/A"}</td>
                      <td>
                          <button class="btn-acao btn-editar"
                              onclick="prepararEdicao(${clinica.idClinica})">
                              Editar
                          </button>
                          <button class="btn-acao btn-excluir"
                              onclick="excluirClinica(${clinica.idClinica})">
                              Excluir
                          </button>
                      </td>
                  </tr>
              `;
        });
      } catch (error) {
        console.error(error);
        tabelaCorpo.innerHTML =
          '<tr><td colspan="5">Erro ao carregar dados.</td></tr>';
      }
    }
    formClinica.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = clinicaIdInput.value;
      const clinica = {
        nome: clinicaNomeInput.value,
        email: clinicaEmailInput.value,
        rua: clinicaRuaInput.value,
        numero: clinicaNumeroInput.value,
        bairro: clinicaBairroInput.value,
        cidade: clinicaCidadeInput.value,
        cep: clinicaCepInput.value,
      };
      if (!clinica.nome) {
        alert("O nome da clínica é obrigatório.");
        return;
      }
      const isEdicao = id !== "";
      const method = isEdicao ? "PUT" : "POST";
      const url = isEdicao ? `/api/clinicas/${id}` : "/api/clinicas";
      if (isEdicao) {
        clinica.idClinica = parseInt(id);
      }
      try {
        const response = await fetch(url, {
          method: method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(clinica),
        });
        if (response.ok || response.status === 201) {
          alert(`Clínica ${isEdicao ? "atualizada" : "salva"} com sucesso!`);
          limparFormulario();
          carregarClinicas();
        } else {
          alert("Erro ao salvar clínica.");
        }
      } catch (error) {
        console.error("Erro de rede:", error);
        alert("Erro de conexão ao salvar.");
      }
    });
    function prepararEdicao(id) {
      // Busca a clínica no nosso cache
      const clinicaParaEditar = clinicasCarregadas.find(
        (c) => c.idClinica === id
      );
      if (!clinicaParaEditar) return;
      formTitulo.textContent = `Editando Clínica (ID: ${id})`;
      clinicaIdInput.value = clinicaParaEditar.idClinica;
      clinicaNomeInput.value = clinicaParaEditar.nome;
      clinicaEmailInput.value = clinicaParaEditar.email || "";
      clinicaRuaInput.value = clinicaParaEditar.rua || "";
      clinicaNumeroInput.value = clinicaParaEditar.numero || "";
      clinicaBairroInput.value = clinicaParaEditar.bairro || "";
      clinicaCidadeInput.value = clinicaParaEditar.cidade || "";
      clinicaCepInput.value = clinicaParaEditar.cep || "";
      btnCancelarEdicao.style.display = "block";
      window.scrollTo(0, 0);
    }
    async function excluirClinica(id) {
      if (!confirm(`Tem certeza que deseja excluir a clínica ID ${id}?`)) {
        return;
      }
      try {
        const response = await fetch(`/api/clinicas/${id}`, {
          method: "DELETE",
        });
        if (response.ok || response.status === 204) {
          alert("Clínica excluída com sucesso!");
          carregarClinicas();
        } else {
          alert(
            "Erro ao excluir clínica. (Ela pode estar sendo usada em um certificado)."
          );
        }
      } catch (error) {
        console.error("Erro de rede:", error);
        alert("Erro de conexão ao excluir.");
      }
    }
    function limparFormulario() {
      formTitulo.textContent = "Gerenciar Clínicas";
      formClinica.reset();
      clinicaIdInput.value = "";
      btnCancelarEdicao.style.display = "none";
    }
    btnCancelarEdicao.addEventListener("click", limparFormulario);

    document.addEventListener("DOMContentLoaded", carregarClinicas);
</script>
</body>
</html>
