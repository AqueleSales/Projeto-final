<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Assistente Pet | Login</title>
    <link rel="stylesheet" href="css/login.css" />
</head>

<style>
    /* ====== RESET ====== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: #eef2f7; /* tom claro como no print */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ====== CARD ====== */
    .card {
      background: #fff;
      width: 100%;
      max-width: 430px;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0px 4px 14px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    /* ====== LOGO E TÍTULO ====== */
    .logo-area h1 {
      font-size: 1.9rem;
      margin-bottom: 0.3rem;
      color: #1e4a7d; /* azul parecido com o print */
      font-weight: 600;
    }

    .logo-area h1 span {
      color: #2fa54d; /* verde */
    }

    .logo-area p {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 1.8rem;
    }

    /* ====== FORM ====== */
    .input-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e4a7d;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #c9d4e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #2fa54d;
      outline: none;
      box-shadow: 0px 0px 4px rgba(47, 165, 77, 0.4);
    }

    /* ====== BOTÃO ====== */
    .btn {
      width: 100%;
      background: #2fa54d;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #279244;
    }

    /* ====== RODAPÉ ====== */
    .footer-text {
      margin-top: 1.4rem;
      font-size: 0.95rem;
      color: #333;
    }

    .footer-text a {
      color: #1e4a7d;
      font-weight: 600;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    /* ====== RESPONSIVO ====== */
    @media (max-width: 480px) {
      .card {
        padding: 1.8rem;
        max-width: 95%;
      }

      .logo-area h1 {
        font-size: 1.6rem;
      }
    }
</style>

<body>
<div class="card">
    <div class="logo-area">
        <h1>Meu <span>Assistente Pet</span></h1>
        <p>Faça login para continuar</p>
    </div>
    <form id="login-form">
        <div class="input-group">
            <label for="email">E-mail</label>
            <input
                    type="email"
                    id="email"
                    placeholder="seuemail@exemplo.com"
                    required
            />
        </div>
        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required />
        </div>
        <button type="submit" class="btn">Entrar</button>
    </form>
    <div class="footer-text">
        <p>Não tem uma conta? <a href="registro-portal.html">Registre-se</a></p>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("login-form");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const apiUrl = '/api/pessoas/login';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });

                if (response.ok) {
                    const usuario = await response.json();

                    // Salva o usuário no "cache" do navegador
                    localStorage.setItem('usuarioLogado', JSON.stringify(usuario));
                    alert('Login com sucesso! Bem-vindo(a), ' + usuario.nome);

                    // --- INÍCIO DA LÓGICA DE REDIRECIONAMENTO ATUALIZADA ---

                    if (usuario.role === "DONO") {
                        // Se for Dono, vai para o dashboard de pets
                        window.location.href = 'dashboard.html';

                    } else if (usuario.role === "VETERINARIO") {
                        // Se for Veterinário, vai para o dashboard de vet
                        window.location.href = 'dashboard-vet.html';

                    } else if (usuario.role === "TREINADOR") {
                        // Se for Treinador, vai para o NOVO dashboard
                        window.location.href = 'dashboard-treinador.html';

                    } else {
                        // Caso não tenha papel
                        alert("Seu usuário não tem um papel definido (Dono, Vet ou Treinador).");
                    }
                    // --- FIM DA LÓGICA ---

                } else {
                    alert('E-mail ou Senha incorretos.');
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                alert('Erro de Rede: Não foi possível conectar ao servidor.');
            }
        });
    });
</script>
</body>
</html>
